<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Lab - 하윤의 바탕화면</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="bg-entity"></div>

    <header>
        <div class="header-container">
            <div class="header-logo">💻 Hayoon OS</div>
            <button class="hamburger-btn" onclick="toggleNavMenu()">☰</button>
            <nav class="navbar" id="nav-menu">
                <a href="index.html" class="nav-item">🏠 Home</a>
                <a href="profile.html" class="nav-item">👤 Profile</a>
                <a href="projects.html" class="nav-item">💻 Projects</a>
                <a href="growth.html" class="nav-item">🌱 Growth</a>
                <a href="playlab.html" class="nav-item active">🎬 Play Lab</a>
                <a href="contact.html" class="nav-item">✉ Contact</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="win-box">
            <div class="win-header">
                <div class="win-title">🎬 DolphinHelper.exe</div>
                <div class="win-controls"><div class="win-btn close-btn" onclick="closePage()">X</div></div>
            </div>
            <div class="win-content">
                <h2 class="glitch-target" data-original="🎬 Play Lab">🎬 Play Lab</h2>
                <div style="text-align: center; margin-bottom: 15px;">
                    <b class="glitch-target" data-original="🐬 컴퓨터 도우미 (돌고래) 키우기">🐬 컴퓨터 도우미 (돌고래) 키우기</b>
                    <p style="font-size: 0.85rem; color: #666; margin-top: 4px;" id="pet-guide" class="glitch-target" data-original="먹이를 주고, 씻겨주고, 재워주며 돌고래 도우미를 관리해주세요!">먹이를 주고, 씻겨주고, 재워주며 돌고래 도우미를 관리해주세요!</p>
                </div>

                <div class="pet-container">
                    <div class="pet-screen">
                        <div id="pet-dialog" class="pet-dialog">큐우-! 안녕!</div>
                        <div class="dolphin-canvas">
                            <div id="dolphin-char" class="dolphin-pixel">🐬</div>
                        </div>
                    </div>

                    <div class="pet-stats">
                        <div class="stat-row">
                            <span class="glitch-target" data-original="🐟 배부름">🐟 배부름</span>
                            <div class="stat-bar-bg"><div id="satiety-fill" class="stat-bar-fill"></div></div>
                        </div>
                        <div class="stat-row">
                            <span class="glitch-target" data-original="🧼 청결도">🧼 청결도</span>
                            <div class="stat-bar-bg"><div id="cleanliness-fill" class="stat-bar-fill"></div></div>
                        </div>
                        <div class="stat-row">
                            <span class="glitch-target" data-original="💤 체력">💤 체력</span>
                            <div class="stat-bar-bg"><div id="energy-fill" class="stat-bar-fill"></div></div>
                        </div>
                    </div>

                    <div class="pet-controls">
                        <button class="pet-action-btn" onclick="feedPet()">🐟 먹이주기</button>
                        <button class="pet-action-btn" onclick="cleanPet()">🧼 씻기기</button>
                        <button class="pet-action-btn" onclick="sleepPet()">💤 재우기</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer id="main-footer">
        <div class="start-btn" id="start-btn" onclick="handleStartClick()">
            <span>☁️</span> 시작 (Start)
        </div>
        <div class="system-tray">
            <button class="settings-btn" onclick="toggleSettings()">▲</button>
            <span id="clock">00:00 AM</span>
            <div id="settings-popup" class="settings-popup">
                <div style="font-weight: bold; border-bottom: 1px solid #ccc; padding-bottom: 4px; margin-bottom: 4px;">⚙️ 환경 설정</div>
                <div class="setting-row">
                    <span>공포 모드</span>
                    <input type="checkbox" id="toggle-horror" onchange="toggleHorrorSetting(this.checked)">
                </div>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
