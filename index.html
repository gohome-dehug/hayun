<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>하윤의 바탕화면</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="bg-entity"></div>

    <div id="black-door" onclick="triggerBSOD()" title="문 클릭" style="display:none;">
        <span style="color: #ef4444; font-size: 0.8rem; text-align: center;">ENTER</span>
    </div>

    <div id="bsod-screen" onclick="resetFromBSOD()" style="display:none;">
        <h1>:(</h1>
        <p>PC에 문제가 발생하여 다시 시작해야 합니다.<br>일부 오류 정보를 수집하고 있습니다.</p>
        <p style="font-size: 14px; margin-top: 20px;">중지 코드: CRITICAL_PROCESS_DIED</p>
        <p style="font-size: 13px; opacity: 0.8; margin-top: 30px;">(화면을 클릭하면 시스템을 복구합니다)</p>
    </div>

    <header>
        <div class="header-container">
            <div class="header-logo">💻 Hayoon OS</div>
            <button class="hamburger-btn" onclick="toggleNavMenu()">☰</button>
            <nav class="navbar" id="nav-menu">
                <a href="index.html" class="nav-item active">🏠 Home</a>
                <a href="profile.html" class="nav-item">👤 Profile</a>
                <a href="projects.html" class="nav-item">💻 Projects</a>
                <a href="growth.html" class="nav-item">🌱 Growth</a>
                <a href="playlab.html" class="nav-item">🎬 Play Lab</a>
                <a href="contact.html" class="nav-item">✉ Contact</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="win-box">
            <div class="win-header">
                <div class="win-title">💾 Welcome.exe</div>
                <div class="win-controls">
                    <div class="win-btn close-btn" onclick="closePage()">X</div>
                </div>
            </div>
            <div class="win-content home-center">
                <h1 class="home-title glitch-target" data-original="바탕화면에 오신것을 환영합니다<br>무엇이 궁금하신가요?">바탕화면에 오신것을 환영합니다<br>무엇이 궁금하신가요?</h1>
                <div class="home-sub glitch-target" data-original="하윤의 자기소개가 있는 개인 컴퓨터 입니다!">
                    하윤의 자기소개가 있는 개인 컴퓨터 입니다!
                </div>
            </div>
        </section>
    </main>

    <footer id="main-footer">
        <div class="start-btn" id="start-btn" onclick="handleStartClick()">
            <span>☁️</span> 시작 (Start)
        </div>
        <div class="system-tray">
            <button class="settings-btn" onclick="toggleSettings()">▲</button>
            <span id="clock">00:00 AM</span>
            <div id="settings-popup" class="settings-popup">
                <div style="font-weight: bold; border-bottom: 1px solid #ccc; padding-bottom: 4px; margin-bottom: 4px;">⚙️ 환경 설정</div>
                <div class="setting-row">
                    <span>공포 모드</span>
                    <input type="checkbox" id="toggle-horror" onchange="toggleHorrorSetting(this.checked)">
                </div>
            </div>
        </div>
    </footer>

    <script>
        let isHorrorEnabled = localStorage.getItem('horrorEnabled') === 'true';
        let isHorrorMode = localStorage.getItem('horrorMode') === 'true';
        let restartClickCount = parseInt(localStorage.getItem('restartClickCount') || '0', 10);
        let petStats = JSON.parse(localStorage.getItem('petStats')) || { satiety: 20, cleanliness: 20, energy: 20 };

        const glitchChars = "̷̶̵̶̸̶̵̷̸̷̶̵̸̸̷̷̷̸̷̷01#%&*@!$/\\";
        const horrorBaseDialogs = [
            "왜 나를 방치했어...",
            "빛이 닿지 않는 곳으로...",
            "너도 나와 함께 깊은 곳으로...",
            "너 뒤에 누군가 서있어...",
            "눈을 감아도 널 보고 있어..."
        ];

        document.addEventListener("DOMContentLoaded", () => {
            const toggleHorror = document.getElementById('toggle-horror');
            if (toggleHorror) toggleHorror.checked = isHorrorEnabled;
            if (isHorrorMode) applyHorrorUI();
            updateClock();
            setInterval(updateClock, 1000);
        });

        function toggleHorrorSetting(enabled) {
            isHorrorEnabled = enabled;
            localStorage.setItem('horrorEnabled', enabled);
            if (!enabled && isHorrorMode) resetToNormal();
        }

        function updateClock() {
            const clock = document.getElementById('clock');
            if (!clock) return;
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            clock.innerText = `${hours}:${minutes} ${ampm}`;
        }

        function makeGlitchedText(text) {
            let result = "";
            for (let i = 0; i < text.length; i++) {
                result += Math.random() > 0.4 ? glitchChars[Math.floor(Math.random() * glitchChars.length)] : text[i];
            }
            return result;
        }

        function applyHorrorUI() {
            document.body.classList.add('horro-mode');
            document.querySelectorAll('.glitch-target').forEach(el => {
                const orig = el.getAttribute('data-original');
                if (orig) {
                    el.innerText = makeGlitchedText(orig);
                    el.classList.add('glitch-active');
                }
            });
            updateStartButtonText();
        }

        function handleStartClick() {
            if (!isHorrorMode) return;
            restartClickCount++;
            localStorage.setItem('restartClickCount', restartClickCount);
            updateStartButtonText();
            if (restartClickCount >= 5) resetToNormal();
        }

        function updateStartButtonText() {
            const startBtn = document.getElementById('start-btn');
            if (!startBtn) return;
            if (isHorrorMode) {
                startBtn.innerHTML = `<span>🔄</span> 재시작 (${5 - restartClickCount}/5)`;
            } else {
                startBtn.innerHTML = `<span>☁️</span> 시작 (Start)`;
            }
        }

        function resetToNormal() {
            isHorrorMode = false;
            restartClickCount = 0;
            localStorage.setItem('horrorMode', 'false');
            localStorage.setItem('restartClickCount', '0');
            document.body.classList.remove('horro-mode');
            const door = document.getElementById('black-door');
            if (door) door.style.display = 'none';
            petStats = { satiety: 50, cleanliness: 50, energy: 50 };
            localStorage.setItem('petStats', JSON.stringify(petStats));
            document.querySelectorAll('.glitch-target').forEach(el => {
                const orig = el.getAttribute('data-original');
                if (orig) {
                    el.innerHTML = orig;
                    el.classList.remove('glitch-active');
                }
            });
            updateStartButtonText();
        }

        function closePage() {
            if (isHorrorMode) {
                const door = document.getElementById('black-door');
                if (door) door.style.display = 'flex';
            }
        }

        function triggerBSOD() {
            const bsod = document.getElementById('bsod-screen');
            if (bsod) bsod.style.display = 'flex';
        }

        function resetFromBSOD() {
            const bsod = document.getElementById('bsod-screen');
            if (bsod) bsod.style.display = 'none';
            resetToNormal();
        }

        function toggleNavMenu() {
            document.getElementById('nav-menu').classList.toggle('active');
        }

        function toggleSettings() {
            document.getElementById('settings-popup').classList.toggle('active');
        }
    </script>
</body>
</html>
